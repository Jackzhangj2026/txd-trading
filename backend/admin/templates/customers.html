{% extends "base.html" %}
{% block title %}Customers{% endblock %}
{% block content %}
<div class="mb-8">
    <h1 class="text-3xl font-bold">Customers</h1>
    <p class="text-gray-500 mt-1">Prospects and client leads</p>
</div>

<div class="mb-4 flex gap-2">
    <input id="search-input" type="text" placeholder="Search name, company, email..." class="bg-gray-800 text-white px-3 py-2 rounded-lg text-sm border border-gray-700 flex-1" onkeyup="loadCustomers()">
    <select id="filter-source" class="bg-gray-800 text-white px-3 py-2 rounded-lg text-sm border border-gray-700" onchange="loadCustomers()">
        <option value="">All Sources</option>
        <option value="website">Website</option>
        <option value="email">Email</option>
        <option value="alibaba">Alibaba</option>
        <option value="linkedin">LinkedIn</option>
        <option value="import">Import</option>
    </select>
</div>

<div class="card">
    <table class="w-full text-sm">
        <thead>
            <tr class="text-gray-400 border-b border-gray-700">
                <th class="text-left py-3 px-2">Name</th>
                <th class="text-left py-3 px-2">Company</th>
                <th class="text-left py-3 px-2">Email</th>
                <th class="text-left py-3 px-2">Country</th>
                <th class="text-left py-3 px-2">Score</th>
                <th class="text-left py-3 px-2">Source</th>
            </tr>
        </thead>
        <tbody id="customer-table-body">
            <tr><td colspan="6" class="text-gray-500 py-8 text-center">Loading...</td></tr>
        </tbody>
    </table>
</div>

<script>
async function loadCustomers() {
    const search = document.getElementById('search-input').value;
    const source = document.getElementById('filter-source').value;
    let url = '/api/customers?page_size=50';
    if (search) url += '&search=' + encodeURIComponent(search);
    if (source) url += '&source=' + source;

    const res = await fetch(url);
    const data = await res.json();
    const tbody = document.getElementById('customer-table-body');
    if (data.items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-gray-500 py-8 text-center">No customers found</td></tr>';
        return;
    }
    tbody.innerHTML = data.items.map(c => {
        const scoreColor = c.score >= 60 ? '#22c55e' : c.score >= 30 ? '#eab308' : '#6b7280';
        return `<tr class="border-b border-gray-800 hover:bg-white/5">
            <td class="py-3 px-2 text-white">${c.name || '—'}</td>
            <td class="py-3 px-2 text-gray-300">${c.company || '—'}</td>
            <td class="py-3 px-2 text-gray-400">${c.email || '—'}</td>
            <td class="py-3 px-2 text-gray-400">${c.country || '—'}</td>
            <td class="py-3 px-2"><span class="badge" style="background:${scoreColor}22;color:${scoreColor}">${c.score}</span></td>
            <td class="py-3 px-2 text-gray-400">${c.source || '—'}</td>
        </tr>`;
    }).join('');
}
loadCustomers();
</script>
{% endblock %}
