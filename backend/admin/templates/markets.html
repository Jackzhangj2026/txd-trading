{% extends "base.html" %}
{% block title %}Target Markets{% endblock %}
{% block content %}
<div class="mb-8">
    <h1 class="text-3xl font-bold">🎯 Target Markets</h1>
    <p class="text-gray-500 mt-1">Define markets to scan for leads and intelligence</p>
</div>

<div class="grid grid-cols-1 gap-6 mb-8" id="markets-grid">
    <!-- Markets loaded by JS -->
</div>

<script>
async function loadMarkets() {
    try {
        const res = await fetch('/api/target-markets');
        const data = await res.json();
        const grid = document.getElementById('markets-grid');
        
        if (data.items.length === 0) {
            grid.innerHTML = '<div class="card text-center py-12"><p class="text-gray-500">No target markets defined yet. Add one via the API.</p></div>';
            return;
        }
        
        grid.innerHTML = data.items.map(m => {
            let statusColor = m.active ? '#22c55e' : '#6b7280';
            let statusText = m.active ? 'Active' : 'Inactive';
            let priorityDots = '●'.repeat(m.priority) + '○'.repeat(10 - m.priority);
            
            return `<div class="card">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h3 class="text-xl font-bold">${m.name}</h3>
                        <div class="text-xs text-gray-500 mt-1">Priority: ${priorityDots}</div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="badge" style="background:${statusColor}22;color:${statusColor}">${statusText}</span>
                        <span class="text-xs text-gray-500">${m.scan_frequency}</span>
                    </div>
                </div>
                
                <div class="grid grid-cols-4 gap-4 mb-4 text-sm">
                    <div>
                        <div class="text-gray-500 text-xs">Keywords</div>
                        <div class="text-gray-300 mt-1">${JSON.parse(m.keywords || '[]').join(', ') || '—'}</div>
                    </div>
                    <div>
                        <div class="text-gray-500 text-xs">Products</div>
                        <div class="text-gray-300 mt-1">${JSON.parse(m.products || '[]').join(', ') || '—'}</div>
                    </div>
                    <div>
                        <div class="text-gray-500 text-xs">Leads Found</div>
                        <div class="text-2xl font-bold mt-1">${m.leads_count || 0}</div>
                    </div>
                    <div>
                        <div class="text-gray-500 text-xs">Last Scanned</div>
                        <div class="text-gray-300 mt-1">${m.last_scanned ? new Date(m.last_scanned).toLocaleDateString() : 'Never'}</div>
                    </div>
                </div>
                
                <div class="flex gap-2 mt-4">
                    <button onclick="scanMarket('${m.id}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition"
                        style="background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff">
                        🔍 Scan Now
                    </button>
                    <button onclick="scoreLeads('${m.id}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition border border-gray-600 text-gray-300 hover:bg-white/5">
                        📊 Re-score
                    </button>
                    <button onclick="generateKeywords('${m.id}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition border border-gray-600 text-gray-300 hover:bg-white/5">
                        ✨ Gen Keywords
                    </button>
                    <span id="status-${m.id}" class="text-xs text-gray-500 ml-2 self-center"></span>
                </div>
                
                <div class="mt-4 border-t border-gray-800 pt-3" id="leads-${m.id}">
                    <div class="text-xs text-gray-500">Loading leads...</div>
                </div>
            </div>`;
        }).join('');
        
        // Load leads for each market
        data.items.forEach(m => loadLeads(m.id, m.name));
        
    } catch (e) {
        document.getElementById('markets-grid').innerHTML = '<div class="card text-center py-12"><p class="text-red-400">Failed to load markets</p></div>';
    }
}

async function loadLeads(marketId, marketName) {
    try {
        const res = await fetch(`/api/target-markets/${marketId}/leads?page_size=5`);
        const data = await res.json();
        const div = document.getElementById(`leads-${marketId}`);
        
        if (data.items.length === 0) {
            div.innerHTML = '<div class="text-xs text-gray-500">No leads yet</div>';
            return;
        }
        
        div.innerHTML = `<div class="text-xs text-gray-400 mb-2">Recent leads (${data.total} total):</div>
        <div class="flex flex-wrap gap-2">
            ${data.items.map(l => {
                const scoreColor = l.score >= 60 ? '#22c55e' : l.score >= 30 ? '#eab308' : '#6b7280';
                return `<span class="badge text-xs" style="background:#ffffff08;border:1px solid #333;padding:4px 8px">
                    ${l.company || l.name || 'Unknown'}
                    <span class="badge ml-1" style="background:${scoreColor}22;color:${scoreColor};font-size:10px">${l.score}</span>
                </span>`;
            }).join('')}
        </div>`;
    } catch (e) {
        document.getElementById(`leads-${marketId}`).innerHTML = '';
    }
}

async function scanMarket(id) {
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = '⏳ Scanning...';
    document.getElementById(`status-${id}`).textContent = '';
    
    try {
        const res = await fetch(`/api/target-markets/${id}/scan`, { method: 'POST' });
        const data = await res.json();
        document.getElementById(`status-${id}`).textContent = `✅ Found ${data.leads_extracted?.length || 0} leads`;
        loadMarkets(); // Refresh
    } catch (e) {
        document.getElementById(`status-${id}`).textContent = '❌ Scan failed';
    } finally {
        btn.disabled = false;
        btn.textContent = '🔍 Scan Now';
    }
}

async function scoreLeads(id) {
    document.getElementById(`status-${id}`).textContent = '⏳ Scoring...';
    try {
        const res = await fetch(`/api/target-markets/${id}/score-leads`, { method: 'POST' });
        const data = await res.json();
        document.getElementById(`status-${id}`).textContent = `✅ ${data.scores_updated} scores updated`;
        loadMarkets();
    } catch (e) {
        document.getElementById(`status-${id}`).textContent = '❌ Failed';
    }
}

async function generateKeywords(id) {
    document.getElementById(`status-${id}`).textContent = '⏳ Generating...';
    try {
        const res = await fetch(`/api/target-markets/generate-keywords`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: 'PP hollow board'})
        });
        const data = await res.json();
        document.getElementById(`status-${id}`).textContent = `✅ ${data.keywords?.length || 0} keywords generated`;
    } catch (e) {
        document.getElementById(`status-${id}`).textContent = '❌ Failed';
    }
}

loadMarkets();
</script>
{% endblock %}
