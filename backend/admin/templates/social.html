{% extends "base.html" %}
{% block title %}Social Media{% endblock %}
{% block content %}
<div class="mb-8">
    <h1 class="text-3xl font-bold">📱 Social Media</h1>
    <p class="text-gray-500 mt-1">Generate, schedule, and manage social media content</p>
    <div class="flex gap-2 mt-3">
        <button onclick="loginRED()" class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-purple-500 text-purple-400 hover:bg-purple-500/10 transition">🔑 Login RED (One-time)</button>
        <span id="red-status" class="text-xs text-gray-500 self-center"></span>
    </div>
</div>

<div class="card mb-6">
    <h2 class="text-lg font-semibold mb-4">✨ Generate Content</h2>
    <div class="flex gap-3 mb-4">
        <input id="topic-input" type="text" placeholder="Enter a topic (e.g. 'PP hollow board benefits for logistics')"
            class="flex-1 bg-gray-800 text-white px-4 py-2 rounded-lg text-sm border border-gray-700">
        <button onclick="generateContent()" id="gen-btn"
            class="px-4 py-2 rounded-lg font-semibold text-sm transition"
            style="background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff">
            🪄 Generate
        </button>
    </div>
    <div id="platform-select" class="flex flex-wrap gap-2 mb-2">
        <label class="flex items-center gap-1 text-sm text-gray-400"><input type="checkbox" class="platform-cb" value="linkedin" checked> LinkedIn</label>
        <label class="flex items-center gap-1 text-sm text-gray-400"><input type="checkbox" class="platform-cb" value="twitter" checked> Twitter/X</label>
        <label class="flex items-center gap-1 text-sm text-gray-400"><input type="checkbox" class="platform-cb" value="youtube"> YouTube</label>
        <label class="flex items-center gap-1 text-sm text-gray-400"><input type="checkbox" class="platform-cb" value="pinterest"> Pinterest</label>
        <label class="flex items-center gap-1 text-sm text-gray-400"><input type="checkbox" class="platform-cb" value="tiktok"> TikTok</label>
        <label class="flex items-center gap-1 text-sm text-gray-400"><input type="checkbox" class="platform-cb" value="facebook"> Facebook</label>
        <label class="flex items-center gap-1 text-sm text-gray-400"><input type="checkbox" class="platform-cb" value="red" checked> 小红书</label>
        <label class="flex items-center gap-1 text-sm text-gray-400"><input type="checkbox" class="platform-cb" value="douyin"> 抖音</label>
        <label class="flex items-center gap-1 text-sm text-gray-400"><input type="checkbox" class="platform-cb" value="wechat_article"> 公众号</label>
        <label class="flex items-center gap-1 text-sm text-gray-400"><input type="checkbox" class="platform-cb" value="wechat_moment"> 朋友圈</label>
    </div>
    <div id="gen-status" class="text-sm text-gray-500"></div>
</div>

<div class="card mb-6">
    <h2 class="text-lg font-semibold mb-4">📅 Content Queue</h2>
    <div class="flex gap-2 mb-4">
        <select id="filter-platform" class="bg-gray-800 text-white px-3 py-2 rounded-lg text-sm border border-gray-700" onchange="loadQueue()">
            <option value="">All Platforms</option>
            <option value="linkedin">LinkedIn</option>
            <option value="twitter">Twitter/X</option>
            <option value="youtube">YouTube</option>
            <option value="red">小红书</option>
            <option value="douyin">抖音</option>
            <option value="wechat_article">公众号</option>
            <option value="wechat_moment">朋友圈</option>
        </select>
        <select id="filter-status" class="bg-gray-800 text-white px-3 py-2 rounded-lg text-sm border border-gray-700" onchange="loadQueue()">
            <option value="">All Status</option>
            <option value="draft">Draft</option>
            <option value="scheduled">Scheduled</option>
            <option value="published">Published</option>
        </select>
    </div>
    <table class="w-full text-sm">
        <thead>
            <tr class="text-gray-400 border-b border-gray-700">
                <th class="text-left py-3 px-2">Platform</th>
                <th class="text-left py-3 px-2">Title</th>
                <th class="text-left py-3 px-2">Status</th>
                <th class="text-left py-3 px-2">Language</th>
                <th class="text-left py-3 px-2">Created</th>
                <th class="text-left py-3 px-2">Actions</th>
            </tr>
        </thead>
        <tbody id="queue-table-body">
            <tr><td colspan="6" class="text-gray-500 py-8 text-center">Loading...</td></tr>
        </tbody>
    </table>
</div>

<script>
async function generateContent() {
    const topic = document.getElementById('topic-input').value;
    if (!topic) { alert('Please enter a topic'); return; }

    const checkboxes = document.querySelectorAll('.platform-cb:checked');
    const platforms = Array.from(checkboxes).map(cb => cb.value);

    const btn = document.getElementById('gen-btn');
    const status = document.getElementById('gen-status');
    btn.disabled = true;
    btn.textContent = '⏳ Generating...';
    status.textContent = '';

    try {
        const res = await fetch('/api/content-media/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({topic, platforms})
        });
        const data = await res.json();
        status.textContent = `✅ Generated ${data.total} posts`;
        loadQueue();
    } catch (e) {
        status.textContent = '❌ Failed to generate';
    } finally {
        btn.disabled = false;
        btn.textContent = '🪄 Generate';
    }
}

async function loadQueue() {
    const platform = document.getElementById('filter-platform').value;
    const status = document.getElementById('filter-status').value;
    let url = '/api/content-media/queue?page_size=30';
    if (platform) url += '&platform=' + platform;
    if (status) url += '&status=' + status;

    try {
        const res = await fetch(url);
        const data = await res.json();
        const tbody = document.getElementById('queue-table-body');
        if (data.items.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-gray-500 py-8 text-center">No content yet. Generate some!</td></tr>';
            return;
        }
        tbody.innerHTML = data.items.map(c => {
            _contentCache[c.id] = c;
            const platformColors = {
                'linkedin': '#0a66c2', 'twitter': '#1da1f2', 'youtube': '#ff0000',
                'pinterest': '#e60023', 'tiktok': '#000000', 'facebook': '#1877f2',
                'red': '#ff2442', 'douyin': '#161823', 'wechat_article': '#07c160',
                'wechat_moment': '#07c160',
            };
            const stColors = {'draft': '#6b7280', 'scheduled': '#eab308', 'published': '#22c55e', 'failed': '#f43f5e'};
            return `<tr class="border-b border-gray-800 hover:bg-white/5 cursor-pointer" onclick="toggleContentDetail(this, '${c.id}')">
                <td class="py-3 px-2"><span class="badge" style="background:${platformColors[c.platform] || '#333'}22;color:${platformColors[c.platform] || '#fff'}">${c.platform_display}</span></td>
                <td class="py-3 px-2 text-gray-300">${c.title.substring(0, 50)}</td>
                <td class="py-3 px-2"><span class="badge" style="background:${stColors[c.status] || '#333'}22;color:${stColors[c.status] || '#fff'}">${c.status}</span></td>
                <td class="py-3 px-2 text-gray-400">${c.language === 'zh' ? '🇨🇳' : '🇬🇧'}</td>
                <td class="py-3 px-2 text-gray-400">${c.created_at ? new Date(c.created_at).toLocaleDateString() : '—'}</td>
                <td class="py-3 px-2">
                    ${c.platform === 'red' ? `
                        <button onclick="event.stopPropagation(); publishToRED('${c.id}')" class="text-xs text-purple-400 hover:text-purple-300 mr-2">🚀 Auto</button>
                        <button onclick="event.stopPropagation(); copyContent('${c.id}')" class="text-xs text-green-400 hover:text-green-300">📋 Copy</button>
                    ` : `
                        <button onclick="event.stopPropagation(); publishContent('${c.id}')" class="text-xs text-purple-400 hover:text-purple-300">Publish</button>
                    `}
                </td>
            </tr>
            <tr id="detail-${c.id}" class="border-b border-gray-800 hidden">
                <td colspan="6" class="py-4 px-6">
                    <div class="bg-gray-800 rounded-lg p-4 text-gray-200 max-h-[500px] overflow-y-auto font-sans text-sm leading-relaxed content-body"></div>
                </td>
            </tr>`;
        }).join('');
    } catch (e) {
        document.getElementById('queue-table-body').innerHTML = '<tr><td colspan="6" class="text-gray-500 py-8 text-center">Failed to load</td></tr>';
    }
}

async function publishContent(id) {
    if (!confirm('Mark this content as published?')) return;
    try {
        await fetch(`/api/content-media/${id}/publish`, { method: 'POST' });
        loadQueue();
    } catch (e) {
        alert('Failed to publish');
    }
}

// Store loaded content items for detail expansion
let _contentCache = {};

function toggleContentDetail(row, id) {
    const detail = document.getElementById('detail-' + id);
    if (!detail) return;
    if (!detail.classList.contains('hidden')) {
        detail.classList.add('hidden');
        return;
    }
    const contentDiv = detail.querySelector('.content-body');
    if (contentDiv && _contentCache[id]) {
        const item = _contentCache[id];
        const body = item.body || item.body_preview || '';
        const platform = item.platform || '';

        // Platform-specific wrapper styling
        if (platform === 'red') {
            contentDiv.innerHTML = `
                <div style="max-width:420px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.15);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
                    <div style="padding:20px 16px 16px;color:#222;font-size:15px;line-height:1.7;">
                        ${body || '<p class="text-gray-400">No content</p>'}
                    </div>
                    <div style="padding:0 16px 16px;display:flex;align-items:center;gap:8px;color:#999;font-size:12px;border-top:1px solid #f0f0f0;margin:0 16px;padding-top:12px;">
                        <span>❤️ 0</span><span>💬 0</span><span>⭐ 0</span>
                    </div>
                </div>`;
        } else {
            // Default: clean card
            contentDiv.innerHTML = `
                <div style="max-width:600px;background:#1f2937;border-radius:12px;padding:20px;color:#e5e7eb;font-size:14px;line-height:1.6;">
                    ${body || '<span class="text-gray-500">No content generated yet</span>'}
                </div>`;
        }
    }
    detail.classList.remove('hidden');
}

// ─── RED Auto-Publish ────────────────────────────

async function loginRED() {
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = 'Opening browser...';
    try {
        const res = await fetch('/api/content-media/red-login', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
            document.getElementById('red-status').textContent = '✅ Logged in';
            document.getElementById('red-status').style.color = '#22c55e';
        } else {
            document.getElementById('red-status').textContent = '⚠️ ' + data.message;
            document.getElementById('red-status').style.color = '#f59e0b';
        }
    } catch (e) {
        document.getElementById('red-status').textContent = '❌ Failed';
        document.getElementById('red-status').style.color = '#f43f5e';
    }
    btn.disabled = false;
    btn.textContent = '🔑 Login RED (One-time)';
}

async function publishToRED(id) {
    if (!confirm('Auto-publish this to RED via browser?')) return;
    try {
        const res = await fetch('/api/content-media/' + id + '/publish-to-red?headless=false', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
            alert('✅ Published to RED!');
            loadQueue();
        } else if (data.action === 'login_required') {
            alert('Need to login first. Click "🔑 Login RED" button above.');
        } else {
            alert('Publish failed: ' + (data.message || 'unknown error'));
        }
    } catch (e) {
        alert('Error: ' + e.message);
    }
}

async function copyContent(id) {
    try {
        const res = await fetch('/api/content-media/' + id + '/copy');
        const data = await res.json();
        if (!data.success) { alert('Not found'); return; }

        const w = window.open('', '_blank', 'width=500,height=750,scrollbars=yes');
        w.document.write('<!DOCTYPE html><html><head><title>Copy to RED</title>' +
            '<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,sans-serif;background:#f5f5f5;padding:20px}' +
            '.card{max-width:420px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.1)}' +
            '.card-body{padding:20px 16px;color:#222;font-size:15px;line-height:1.7}' +
            '.card-body img{max-width:100%!important;border-radius:12px;margin:12px 0;display:block}' +
            '.tips{max-width:420px;margin:16px auto;background:#ede9fe;border-radius:12px;padding:16px;font-size:13px;color:#5b21b6}' +
            '.tips b{display:block;margin-bottom:4px}' +
            '.btn{display:block;width:100%;max-width:420px;margin:12px auto;padding:12px;background:#ff2442;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}' +
            '</style></head><body>' +
            '<div class="card"><div class="card-body">' + (data.body || '') + '</div></div>' +
            '<div class="tips"><b>📋 How to publish:</b>1. Select all (Ctrl+A) and Copy (Ctrl+C)<br>2. Open RED App → Create Note → Paste<br>3. Upload images from your computer<br>4. Add tags and publish!</div>' +
            '<button class="btn" onclick="navigator.clipboard.writeText(document.querySelector(\'.card-body\').innerText).then(()=>alert(\'✅ Text copied! Paste into RED\')).catch(()=>alert(\'Use Ctrl+A then Ctrl+C\'))">📋 Copy Text to Clipboard</button>' +
            '</body></html>');
        w.document.close();
    } catch (e) {
        alert('Error: ' + e.message);
    }
}

loadQueue();
</script>
{% endblock %}
